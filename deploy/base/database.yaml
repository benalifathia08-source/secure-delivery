apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels: {app: release-database}
  template:
    metadata:
      labels: {app: release-database}
    spec:
      serviceAccountName: database
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          imagePullPolicy: Always
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: database-admin, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: runtime, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: runtime, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
        - name: init
          configMap: {name: database-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  clusterIP: None
  selector: {app: release-database}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
