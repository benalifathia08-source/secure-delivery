apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: secure-delivery, namespace: flux-system}
spec:
  interval: 1m
  url: https://github.com/benalifathia08-source/secure-delivery
  ref: {branch: lab-release}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: secure-delivery, namespace: flux-system}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  serviceAccountName: app-reconciler
  sourceRef: {kind: GitRepository, name: secure-delivery}
  path: ./deploy/overlays/lab
  targetNamespace: secure-delivery
  prune: true
  wait: true
