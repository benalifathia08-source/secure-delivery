apiVersion: v1
kind: ServiceAccount
metadata: {name: app-reconciler, namespace: flux-system}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: app-reconciler, namespace: secure-delivery}
rules:
  - apiGroups: ['']
    resources: [services, configmaps, serviceaccounts, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: app-reconciler, namespace: secure-delivery}
subjects:
  - {kind: ServiceAccount, name: app-reconciler, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app-reconciler}
