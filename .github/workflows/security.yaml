name: Security delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      database_image: ${{ steps.publish.outputs.database_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependency tooling
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked
      - name: Run security gates
        run: uv run --locked python scripts/ci.py
      - name: Publish exact tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag secure-delivery:ci "$repository:$GITHUB_SHA"
          docker push "$repository:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$repository:$GITHUB_SHA")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          database_repository="$repository-database"
          docker tag secure-delivery-db:ci "$database_repository:$GITHUB_SHA"
          docker push "$database_repository:$GITHUB_SHA"
          database_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$database_repository:$GITHUB_SHA")
          echo "database_image=$database_digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
      - name: Publish readable gate summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  promote:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Promote only successful candidate to Flux release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.verify.outputs.image }}
          DATABASE_IMAGE: ${{ needs.verify.outputs.database_image }}
        run: python scripts/promote.py
