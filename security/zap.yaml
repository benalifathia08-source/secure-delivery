env:
  contexts:
    - name: release-inventory
      urls:
        - http://app:8080
      includePaths:
        - 'http://app:8080/.*'
  parameters:
    failOnError: true
    failOnWarning: true
    progressToStdout: true
jobs:
  - type: alertFilter
    alertFilters:
      # EX-002: isolated disposable Docker network; no host ports or real credentials.
      - ruleId: 10106
        newRisk: Info
        context: release-inventory
        url: '^http://app:8080(?:/.*)?$'
        urlRegex: true
  - type: requestor
    parameters:
      user: ''
    requests:
      - url: http://app:8080/api/releases
        responseCode: 200
      - url: http://app:8080/health/ready
        responseCode: 200
  - type: spider
    parameters:
      context: release-inventory
      maxDuration: 1
  - type: passiveScan-wait
    parameters:
      maxDuration: 3
  - type: activeScan
    parameters:
      context: release-inventory
      maxScanDurationInMins: 3
      maxRuleDurationInMins: 1
  - type: passiveScan-wait
    parameters:
      maxDuration: 3
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: zap-report
    alwaysRun: true
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: zap-report
    alwaysRun: true
  - type: exitStatus
    parameters:
      errorLevel: Medium
      warnLevel: Low
      okExitValue: 0
      errorExitValue: 1
      warnExitValue: 0
