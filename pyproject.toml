[project]
name = "secure-delivery"
version = "0.1.1"
description = "A locally deployed Kubernetes delivery security lab"
requires-python = ">=3.12,<3.13"
dependencies = ["flask>=3.1,<4", "psycopg[binary]>=3.2,<4", "gunicorn>=23,<26"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixed Docker commands run in disposable CI; /tmp is a bounded non-root tmpfs.
"scripts/ci.py" = ["S607", "S108"]
