- rule: Secure Delivery Canary Read
  desc: Detect a controlled sensitive-file-access simulation in a container.
  condition: >
    evt.type in (open, openat, openat2) and evt.is_open_read=true
    and fd.name=/tmp/secure-delivery-runtime-canary and container.id != host
    and evt.failed=false
  output: >
    Controlled lab canary read (user=%user.name process=%proc.name
    container_id=%container.id file=%fd.name)
  priority: WARNING
  tags: [secure_delivery, canary, mitre_credential_access, T1552]
